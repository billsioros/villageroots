<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f7f7f7;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding:48px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:14px;overflow:hidden;">
            <tr style="background:#1f1419;color:#ffffff;">
              <td style="padding:28px 32px;">
                <span style="font-size:20px;font-weight:bold;">VillageRoots</span>
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <h1 style="font-size:22px;color:#201313;margin:0 0 12px 0;">Reset your password</h1>
                <p style="font-size:15px;color:#6b6262;line-height:1.6;margin:0 0 24px 0;">
                  You asked to reset the password for your VillageRoots account. Click below to choose a new one.
                  If you didn't request this, you can safely ignore this email.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius:8px;">
                      <a href="{{ .ConfirmationURL }}"
                         style="display:inline-block;background:#ff385c;color:#ffffff;padding:14px 28px;border-radius:8px;font-size:15px;font-weight:bold;text-decoration:none;">
                        Reset password
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="font-size:13px;color:#9a9090;line-height:1.6;margin:24px 0 0 0;">
                  The link is valid for a limited time. Questions? Write to the VillageRoots team.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
